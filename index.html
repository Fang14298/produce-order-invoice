<html lang="th">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  :root{
    --green:#1E6B3C; --green-dark:#14502B; --green-soft:#E7F1E7;
    --ink:#22301F; --muted:#71806C; --bg:#F7F8F3; --card:#FFFFFF;
    --line:#E2E7DD; --tag:#F4B942;
    --font-display:'Prompt',sans-serif; --font-body:'Sarabun',sans-serif;
    color-scheme: light only;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--font-body)}
  h1,h2,h3{font-family:var(--font-display)}
  .app{max-width:1280px;margin:0 auto;padding:20px}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
  .topbar h1{font-size:20px;color:var(--green-dark)}
  .topbar .sub{font-size:13px;color:var(--muted)}
  .layout{display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:start}
  @media (max-width:980px){.layout{grid-template-columns:1fr}}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
  .panel h2{font-size:15px;margin-bottom:10px;color:var(--green-dark)}
  .search-box{position:relative;margin-bottom:10px}
  .search-box input{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font-family:var(--font-body);font-size:14px}
  .search-box input:focus{outline:none;border-color:var(--green)}
  .order-list{max-height:60vh;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
  .filters-box { display:flex; gap:8px; margin-bottom:10px; }
  .filters-box select { flex:1; padding:8px; border-radius:8px; border:1px solid var(--line); font-family:var(--font-body); font-size:13px; outline:none; }
  .filters-box select:focus { border-color:var(--green); }
  .select-all-wrap { display:flex; align-items:center; gap:8px; margin-bottom:10px; font-size:13px; cursor:pointer; }
  .order-item{border:1px solid var(--line);border-radius:10px;padding:9px 11px;cursor:pointer;transition:.15s;display:flex;gap:10px;align-items:flex-start}
  .order-item:hover{border-color:var(--green);background:var(--green-soft)}
  .order-item.active{border-color:var(--green);background:var(--green-soft);box-shadow:0 0 0 2px var(--green) inset}
  .order-item-check{margin-top:3px;}
  .order-item-content{flex:1;}
  .order-item .oid{font-weight:700;font-size:13px;color:var(--green-dark)}
  .order-item .ometa{font-size:12px;color:var(--muted);margin-top:2px;display:flex;justify-content:space-between;gap:8px}
  .status-pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;background:#eee;color:#555;margin-top:4px}
  .empty-msg{font-size:13px;color:var(--muted);padding:20px 6px;text-align:center}
  .reload-btn{width:100%;padding:9px;margin-top:10px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-family:var(--font-body);font-size:13px;cursor:pointer;color:var(--ink)}
  .reload-btn:hover{border-color:var(--green);color:var(--green-dark)}
  
  .inv-block{padding-bottom:20px;margin-bottom:20px;border-bottom:2px dashed #ccc;}
  .inv-block:last-child{padding-bottom:0;margin-bottom:0;border-bottom:none;}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .toolbar .fee-field{display:flex;align-items:center;gap:6px;font-size:13px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 10px}
  .toolbar .fee-field input{width:80px;border:none;font-family:var(--font-body);font-size:13px;text-align:right}
  .toolbar .fee-field input:focus{outline:none}
  .btn{padding:10px 18px;border-radius:10px;border:none;font-family:var(--font-body);font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .btn-print{background:var(--green);color:#fff}
  .btn-print:hover{background:var(--green-dark)}
  .btn-pdf{background:#2C3E50;color:#fff}
  .btn-pdf:hover{background:#1c2833}
  .btn:disabled{opacity:.5;cursor:not-allowed}

  .invoice-wrap{background:#d9d9d9;border-radius:14px;padding:24px;display:flex;justify-content:center}

    width:210mm;min-height:297mm;background:#fff;padding:14mm 12mm;
    box-shadow:0 4px 18px rgba(0,0,0,.18);font-family:var(--font-body);color:#111;
  }
  .inv-placeholder{display:flex;align-items:center;justify-content:center;min-height:297mm;color:#999;font-size:14px}

  .inv-header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2.5px solid var(--green);padding-bottom:12px;margin-bottom:16px}
  .inv-brand{display:flex;align-items:center;gap:12px}
  .inv-logo-img{width:56px;height:56px;object-fit:contain;border-radius:10px;background:#fff}
  .inv-brand-title{font-family:var(--font-display);font-size:22px;font-weight:700;color:var(--green)}
  .inv-brand-sub{font-size:12px;color:#555;margin-top:1px}
  .inv-brand-contact{font-size:11.5px;color:#444;margin-top:3px}
  .inv-meta{text-align:right}
  .inv-doc-title{font-family:var(--font-display);font-size:19px;font-weight:700;color:#222}
  .inv-meta-line{font-size:12.5px;color:#333;margin-top:3px}
  .inv-meta-line b{color:#111}
  .inv-meta-sub{font-size:11px;color:#888;margin-top:2px}

  .inv-customer{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;font-size:12.5px;margin-bottom:16px;padding:11px 14px;background:#f9f9f7;border-radius:8px;border:1px solid #eee}
  .inv-customer div b{color:#333}

  table.inv-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:14px}
  table.inv-table th{border-top:2px solid #333;border-bottom:2px solid #333;padding:7px 6px;text-align:left;font-weight:700;font-family:var(--font-display);font-size:12px}
  table.inv-table td{border-bottom:1px solid #eee;padding:7px 6px;vertical-align:top}
  table.inv-table th.num,table.inv-table td.num{text-align:right}
  table.inv-table th.center,table.inv-table td.center{text-align:center}
  table.inv-table tfoot td{border-top:1px solid #ccc;border-bottom:none;padding-top:10px}

  .inv-bottom{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;margin-top:6px;align-items:start}
  .inv-payment-box{border:1px solid #ccc;border-radius:8px;padding:12px;display:flex;gap:12px;align-items:center}
  .inv-qr-img{width:100px;height:100px;border-radius:6px;border:1px solid #ddd;flex-shrink:0}
  .inv-payment-info{font-size:11.5px;line-height:1.55}
  .inv-payment-info .lbl{font-weight:700;font-size:12.5px;color:var(--green-dark);margin-bottom:2px}
  .inv-totals{border:1px solid #ccc;border-radius:8px;padding:12px 14px;font-size:12.5px}
  .inv-total-row{display:flex;justify-content:space-between;margin-bottom:7px}
  .inv-total-row.grand{font-size:16px;font-weight:700;border-top:1.5px solid #333;padding-top:7px;margin-top:2px;color:var(--green-dark)}
  .inv-note{font-size:11.5px;color:#555;margin-top:10px;padding:8px 10px;background:#fffaf0;border:1px dashed #e0c069;border-radius:6px}

  .inv-signatures{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:34px;text-align:center;font-size:11.5px}
  .inv-sig-line{border-bottom:1px dashed #888;height:34px;margin-bottom:6px}

  @media print{
    .topbar, .panel, .toolbar{display:none !important}
    .app{max-width:none;margin:0;padding:0}
    .layout{display:block}
    .invoice-wrap{background:#fff;padding:0;display:block}
    #invoicePage{width:auto;min-height:0;padding:0;box-shadow:none;margin:0}
    .inv-block{page-break-after:always;border-bottom:none;margin-bottom:0;padding-bottom:0;}
    .inv-block:last-child{page-break-after:auto;}
    .inv-header,.inv-customer,.inv-bottom,.inv-signatures{page-break-inside:avoid}
    table.inv-table{page-break-inside:auto}
    table.inv-table tr{page-break-inside:avoid;page-break-after:auto}
    @page{size:A4;margin:14mm 12mm}
  }
</style>

<body>
<div class="app">
  <div class="topbar">
    <div>
      <h1>🧾 ระบบพิมพ์ใบส่งสินค้า / ใบแจ้งหนี้</h1>
      <div class="sub">ร้านสวนผักสด — ดึงข้อมูลสดจากชีต "รายการออเดอร์"</div>
    </div>
    <div class="sub">index.html สำหรับลูกค้า &nbsp;•&nbsp; invoice.html หน้านี้สำหรับแอดมิน</div>
  </div>

  <div class="layout">
    <div class="panel">
      <h2>🔎 ค้นหาออเดอร์</h2>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="ค้นหาเลขที่ออเดอร์ / ชื่อลูกค้า / เบอร์โทร">
      </div>
      <div class="filters-box">
        <select id="filterDate"><option value="">ทุกวันที่</option></select>
        <select id="filterStatus"><option value="">ทุกสถานะ</option></select>
      </div>
      <label class="select-all-wrap">
        <input type="checkbox" id="selectAllCheckbox">
        <span>เลือกทั้งหมด (ที่กรองไว้)</span>
      </label>
      <div class="order-list" id="orderList">
        <div class="empty-msg">กำลังโหลดรายการออเดอร์...</div>
      </div>
      <button class="reload-btn" id="reloadBtn">⟳ โหลดออเดอร์ล่าสุด</button>
    </div>

    <div>
      <div class="toolbar">
        <button class="btn btn-print" id="printBtn" disabled>🖨️ พิมพ์บิล</button>
        <button class="btn btn-pdf" id="pdfBtn" disabled>⬇️ ดาวน์โหลด PDF</button>
        <div class="fee-field">
          <span>ค่าจัดส่ง:</span>
          <input type="number" id="deliveryFee" value="0" min="0" step="1">
          <span>บาท</span>
        </div>
      </div>

      <div class="invoice-wrap">
        <div id="invoicePage">
          <div class="inv-placeholder" id="invPlaceholder">เลือกออเดอร์จากรายการด้านซ้ายเพื่อแสดงใบบิล</div>
          <div id="invContent"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* ================= ตั้งค่า ================= */
const SHEET_ID = "1ihPCg3VKhS59B5RrlKuvFZi9IsZesESkXmrb02cS-84";
const ORDER_SHEET_NAME = "รายการออเดอร์";
const PROMPTPAY_ID = "0933121105";
const PROMPTPAY_NAME = "SUANPHAKSOD"; // ต้องเป็น A-Z เท่านั้นตามสเปค EMVCo

let ORDERS = [];
let SELECTED_ORDERS = [];

/* ================= แปลงค่าวันที่จาก Google Sheets (GViz) ให้เป็น DD/MM/YYYY =================
   ค่าวันที่จากคอลัมน์ที่เป็น Date ในชีต GViz จะส่งมาเป็นข้อความดิบรูปแบบ "Date(YYYY,M,D)" หรือ
   "Date(YYYY,M,D,H,Mi,S)" โดย M (เดือน) เริ่มนับที่ 0 ต้อง +1 ก่อนแสดงผลเสมอ
   หมายเหตุ: แสดงเฉพาะวันที่ ไม่แสดงเวลา แม้ค่าดิบจะมีเวลาติดมาด้วยก็ตาม */
function parseGvizDate(raw) {
  if (!raw) return "";
  const s = String(raw).trim();
  const m = s.match(/^Date\((\d+),(\d+),(\d+)/);
  if (!m) return s; // ไม่ใช่รูปแบบ Date(...) ก็คืนค่าเดิม (เผื่อชีตเก็บเป็นข้อความอยู่แล้ว)
  const year = parseInt(m[1], 10);
  const month = parseInt(m[2], 10) + 1; // GViz เดือนเริ่มที่ 0
  const day = parseInt(m[3], 10);
  const dd = String(day).padStart(2, "0");
  const mm = String(month).padStart(2, "0");
  return `${dd}/${mm}/${year}`;
}

/* ================= โหลดออเดอร์จาก Google Sheet (GViz, อ่านอย่างเดียว ไม่ต้องมี backend) ================= */
async function loadOrders() {
  const list = document.getElementById("orderList");
  list.innerHTML = '<div class="empty-msg">กำลังโหลดรายการออเดอร์...</div>';
  try {
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(ORDER_SHEET_NAME)}&headers=1`;
    const text = await (await fetch(url)).text();
    const json = JSON.parse(text.substring(text.indexOf("{"), text.lastIndexOf("}") + 1));
    const labels = json.table.cols.map(c => String(c.label || "").trim());
    const col = names => labels.findIndex(l => names.some(n => l.includes(n)));
    const iId = col(["เลขที่ออเดอร์"]);
    const iDt = col(["วัน-เวลาสั่งซื้อ", "วัน-เวลา"]);
    const iShop = col(["ชื่อร้าน", "ลูกค้า"]);
    const iPhone = col(["เบอร์โทรศัพท์", "เบอร์โทร"]);
    const iAddr = col(["ที่อยู่จัดส่ง"]);
    const iTax = col(["เลขผู้เสียภาษี"]);
    const iDate = col(["วันที่รับของ"]);
    const iItems = col(["รายการสินค้าที่สั่ง"]);
    const iTotal = col(["ยอดรวม"]);
    const iNote = col(["หมายเหตุ"]);
    const iStatus = col(["สถานะ"]);
    const iLine = col(["LINE User ID"]);

    const val = (r, i) => (i >= 0 && r.c && r.c[i] && r.c[i].v != null) ? r.c[i].v : "";

    ORDERS = json.table.rows
      .map(r => ({
        orderId: String(val(r, iId)).trim(),
        orderDate: parseGvizDate(val(r, iDt)),
        shop: String(val(r, iShop)).trim(),
        phone: String(val(r, iPhone)).trim(),
        address: String(val(r, iAddr)).trim(),
        taxId: String(val(r, iTax)).trim(),
        deliveryDate: parseGvizDate(val(r, iDate)),
        itemsRaw: String(val(r, iItems)).trim(),
        total: Number(val(r, iTotal)) || 0,
        note: String(val(r, iNote)).trim(),
        status: String(val(r, iStatus)).trim() || "รอยืนยัน",
        lineUserId: String(val(r, iLine)).trim()
      }))
      .filter(o => o.orderId);

    populateFilters();
    renderList();
  } catch (e) {
    console.warn("โหลดออเดอร์ไม่สำเร็จ:", e);
    list.innerHTML = '<div class="empty-msg">โหลดข้อมูลไม่สำเร็จ — ตรวจสอบว่าชีตแชร์แบบ "ทุกคนที่มีลิงก์ - ผู้มีสิทธิ์ดู" แล้ว</div>';
  }
}

function renderList(filterText) {
  const list = document.getElementById("orderList");
  const q = (filterText || "").trim().toLowerCase();
  const filtered = !q ? ORDERS : ORDERS.filter(o =>
    o.orderId.toLowerCase().includes(q) ||
    o.shop.toLowerCase().includes(q) ||
    o.phone.toLowerCase().includes(q)
  );
  if (!filtered.length) {
    list.innerHTML = '<div class="empty-msg">ไม่พบออเดอร์ที่ตรงกับคำค้นหา</div>';
    return;
  }
  list.innerHTML = filtered.map(o => `
    <div class="order-item ${SELECTED && SELECTED.orderId === o.orderId ? 'active' : ''}" data-id="${o.orderId}">
      <div class="oid">${o.orderId}</div>
      <div class="ometa"><span>${o.shop || '-'}</span><span>${o.deliveryDate || '-'}</span></div>
      <span class="status-pill">${o.status}</span>
    </div>
  `).join("");
  list.querySelectorAll(".order-item").forEach(el => {
    el.addEventListener("click", () => {
      const order = ORDERS.find(o => o.orderId === el.dataset.id);
      if (order) selectOrder(order);
    });
  });
}

/* ================= แปลงข้อความสรุปรายการสินค้า กลับเป็นตารางแยกรายชิ้น =================
   รูปแบบข้อความต้นทาง (จาก Apps Script): "• ชื่อสินค้า จำนวน หน่วย = ยอดรวม บาท" ต่อบรรทัด */
function parseItems(raw) {
  if (!raw) return [];
  return raw.split("\n").map(line => line.trim()).filter(Boolean).map(line => {
    const clean = line.replace(/^•\s*/, "");
    const m = clean.match(/^(.+?)\s+([\d.,]+)\s+(\S+?)\s*=\s*([\d.,]+)\s*บาท$/);
    if (!m) return { name: clean, qty: "", unit: "", price: "", subtotal: 0 };
    const name = m[1].trim();
    const qty = parseFloat(m[2].replace(/,/g, ""));
    const unit = m[3].trim();
    const subtotal = parseFloat(m[4].replace(/,/g, ""));
    const price = qty ? subtotal / qty : subtotal;
    return { name, qty, unit, price, subtotal };
  });
}

/* ================= PromptPay EMVCo QR Payload (ออฟไลน์ ไม่พึ่ง API ภายนอก) ================= */
function formatTLV(id, value) {
  const length = value.length.toString().padStart(2, '0');
  return id + length + value;
}
function formatPromptPayQR(recipient, amount, merchantName) {
  recipient = String(recipient || "").replace(/[^0-9]/g, '');
  if (recipient.length === 10 && recipient.startsWith('0')) {
    recipient = '0066' + recipient.substring(1);
  }
  let payload = '';
  payload += formatTLV('00', '01');
  payload += formatTLV('01', '11');
  let merchantAccount = '';
  merchantAccount += formatTLV('00', 'A000000677010111');
  merchantAccount += formatTLV('01', recipient);
  payload += formatTLV('29', merchantAccount);
  payload += formatTLV('52', '0000');
  payload += formatTLV('53', '764');
  if (amount && parseFloat(amount) > 0) {
    payload += formatTLV('54', parseFloat(amount).toFixed(2));
  }
  payload += formatTLV('58', 'TH');
  const mName = String(merchantName || 'PromptPay').replace(/[^A-Za-z0-9 ]/g, '').substring(0, 25);
  payload += formatTLV('59', mName || 'PromptPay');
  payload += formatTLV('60', 'Bangkok');
  payload += '6304';
  return payload + crc16(payload).toUpperCase();
}
function crc16(s) {
  let crc = 0xFFFF;
  for (let i = 0; i < s.length; i++) {
    crc ^= s.charCodeAt(i) << 8;
    for (let j = 0; j < 8; j++) {
      crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) : (crc << 1);
      crc &= 0xffff;
    }
  }
  return crc.toString(16).padStart(4, '0');
}
function renderQr(amount) {
  const payload = formatPromptPayQR(PROMPTPAY_ID, amount, PROMPTPAY_NAME);
  const qr = qrcode(0, 'M');
  qr.addData(payload);
  qr.make();
  document.getElementById("mQr").src = qr.createDataURL(6, 4);
}

/* ================= แสดงผลใบบิล ================= */
const fmtMoney = n => Number(n || 0).toLocaleString("th-TH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function selectOrder(order) {
  SELECTED = order;
  document.getElementById("invPlaceholder").style.display = "none";
  document.getElementById("invContent").style.display = "block";
  document.getElementById("printBtn").disabled = false;
  document.getElementById("pdfBtn").disabled = false;

  document.getElementById("mOrderId").textContent = order.orderId;
  document.getElementById("mDeliveryDate").textContent = order.deliveryDate || "-";
  document.getElementById("mOrderDate").textContent = order.orderDate || "-";
  document.getElementById("mShop").textContent = order.shop || "-";
  document.getElementById("mPhone").textContent = order.phone || "-";
  document.getElementById("mTaxId").textContent = (order.taxId && order.taxId !== "-") ? order.taxId : "-";
  document.getElementById("mAddress").textContent = order.address || "-";

  const items = parseItems(order.itemsRaw);
  document.getElementById("mItemsBody").innerHTML = items.map((it, idx) => `
    <tr>
      <td class="center">${idx + 1}</td>
      <td>${it.name}</td>
      <td class="num">${it.qty !== "" ? it.qty : "-"}</td>
      <td class="center">${it.unit || "-"}</td>
      <td class="num">${it.price !== "" ? fmtMoney(it.price) : "-"}</td>
      <td class="num">${fmtMoney(it.subtotal)}</td>
    </tr>
  `).join("");

  const noteWrap = document.getElementById("mNoteWrap");
  if (order.note) {
    noteWrap.style.display = "block";
    document.getElementById("mNote").textContent = order.note;
  } else {
    noteWrap.style.display = "none";
  }

  recalcTotals();
  renderList(document.getElementById("searchInput").value.trim());
}

function recalcTotals() {
  if (!SELECTED) return;
  const fee = parseFloat(document.getElementById("deliveryFee").value) || 0;
  const grand = SELECTED.total + fee;
  document.getElementById("mSubtotal").textContent = fmtMoney(SELECTED.total) + " บาท";
  document.getElementById("mDeliveryFeeShow").textContent = fmtMoney(fee) + " บาท";
  document.getElementById("mGrand").textContent = fmtMoney(grand) + " บาท";
  renderQr(grand);
}

/* ================= ปุ่มควบคุม ================= */
document.getElementById("searchInput").addEventListener("input", e => renderList(e.target.value));
document.getElementById("reloadBtn").addEventListener("click", loadOrders);
document.getElementById("deliveryFee").addEventListener("input", recalcTotals);
document.getElementById("printBtn").addEventListener("click", () => window.print());

/* ================= คำนวณจุดตัดหน้า PDF โดยอิงขอบเขตจริงของแต่ละแถว/บล็อก (เลียนแบบพิมพ์จริง) =================
   ไม่ตัดกลางแถวสินค้าหรือกลางบล็อกสำคัญ, เว้นระยะขอบบน-ล่างต่อหน้าเท่ากับตอนพิมพ์ (14mm),
   และแสดงหัวตารางซ้ำในหน้าถัดไปเมื่อรายการยาวเกินหนึ่งหน้า */
function computePageSlices(node, canvas, pageHeightPx, marginPx) {
  const containerTop = node.getBoundingClientRect().top;
  const scale = canvas.width / node.getBoundingClientRect().width;
  const protectedEls = Array.from(node.querySelectorAll(
    '.inv-header, .inv-customer, table.inv-table thead, table.inv-table tbody tr, #mNoteWrap, .inv-bottom, .inv-signatures'
  )).filter(el => el.offsetParent !== null);

  const rects = protectedEls.map(el => {
    const r = el.getBoundingClientRect();
    return { top: (r.top - containerTop) * scale, bottom: (r.bottom - containerTop) * scale };
  });

  const theadEl = node.querySelector('table.inv-table thead');
  const tbodyEl = node.querySelector('table.inv-table tbody');
  let theadRectPx = null;
  let tbodyBottomPx = 0;
  if (theadEl) {
    const r = theadEl.getBoundingClientRect();
    theadRectPx = { top: (r.top - containerTop) * scale, bottom: (r.bottom - containerTop) * scale };
  }
  if (tbodyEl) {
    const r = tbodyEl.getBoundingClientRect();
    tbodyBottomPx = (r.bottom - containerTop) * scale;
  }

  const EPS = 0.5;
  const pages = [];
  let pageStart = 0;
  let idx = 0;
  while (pageStart < canvas.height - EPS) {
    const pageIndex = pages.length;
    const topReserve = pageIndex === 0 ? 0 : marginPx;
    const bottomReserve = marginPx;
    const repeatHeader = pageIndex > 0 && theadRectPx && pageStart >= theadRectPx.bottom - EPS && pageStart < tbodyBottomPx - EPS;
    const headerReserve = repeatHeader ? (theadRectPx.bottom - theadRectPx.top) : 0;
    const limit = pageStart + pageHeightPx - topReserve - bottomReserve - headerReserve;

    let lastGoodBottom = -1;
    let j = idx;
    while (j < rects.length && rects[j].bottom <= limit + EPS) {
      lastGoodBottom = rects[j].bottom;
      j++;
    }

    let sliceEnd;
    if (lastGoodBottom === -1) {
      sliceEnd = Math.min(limit, canvas.height);
      if (sliceEnd <= pageStart + EPS) sliceEnd = Math.min(pageStart + pageHeightPx, canvas.height);
    } else {
      sliceEnd = lastGoodBottom;
      idx = j;
      if (idx >= rects.length) sliceEnd = canvas.height;
    }
    sliceEnd = Math.min(Math.max(sliceEnd, pageStart + 1), canvas.height);

    pages.push({ start: pageStart, end: sliceEnd, repeatHeader, topMarginPx: topReserve, bottomMarginPx: bottomReserve });
    pageStart = sliceEnd;
  }

  if (pages.length) pages[pages.length - 1].bottomMarginPx = 0;
  return { pages, theadRectPx };
}

/* ================= ดาวน์โหลด PDF (แบ่งหน้าเลียนแบบการพิมพ์จริง ไม่บีบ ไม่ตัดกลางแถว) ================= */
document.getElementById("pdfBtn").addEventListener("click", async () => {
  const btn = document.getElementById("pdfBtn");
  const original = btn.textContent;
  btn.disabled = true; btn.textContent = "⏳ กำลังสร้างไฟล์...";
  try {
    const node = document.getElementById("invoicePage");
    const canvas = await html2canvas(node, { scale: 2, useCORS: true, backgroundColor: "#ffffff" });
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF("p", "mm", "a4");
    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();
    const imgW = pageW;
    const pxPerMm = canvas.width / imgW;
    const pageHeightPx = pageH * pxPerMm;
    const marginPx = 14 * pxPerMm; // เท่ากับระยะขอบหน้ากระดาษตอนสั่งพิมพ์ (14mm)

    const { pages, theadRectPx } = computePageSlices(node, canvas, pageHeightPx, marginPx);

    pages.forEach((pg, i) => {
      const headerHeightPx = (pg.repeatHeader && theadRectPx) ? (theadRectPx.bottom - theadRectPx.top) : 0;
      const bodyHeightPx = pg.end - pg.start;
      const totalHeightPx = Math.max(1, Math.round(pg.topMarginPx + headerHeightPx + bodyHeightPx + pg.bottomMarginPx));
      const pageCanvas = document.createElement("canvas");
      pageCanvas.width = canvas.width;
      pageCanvas.height = totalHeightPx;
      const ctx = pageCanvas.getContext("2d");
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, pageCanvas.width, pageCanvas.height);

      let y = pg.topMarginPx;
      if (headerHeightPx > 0) {
        ctx.drawImage(canvas, 0, theadRectPx.top, canvas.width, headerHeightPx, 0, y, canvas.width, headerHeightPx);
        y += headerHeightPx;
      }
      ctx.drawImage(canvas, 0, pg.start, canvas.width, bodyHeightPx, 0, y, canvas.width, bodyHeightPx);

      const sliceData = pageCanvas.toDataURL("image/png");
      const sliceHmm = (pageCanvas.height * imgW) / canvas.width;
      if (i > 0) pdf.addPage();
      pdf.addImage(sliceData, "PNG", 0, 0, imgW, sliceHmm);
    });

    pdf.save(`ใบแจ้งหนี้-${SELECTED_ORDERS.length === 1 ? SELECTED_ORDERS[0].orderId : "batch"}.pdf`);
  } catch (e) {
    alert("สร้าง PDF ไม่สำเร็จ: " + e.message);
  } finally {
    btn.disabled = false; btn.textContent = original;
  }
});

loadOrders();
</script>
